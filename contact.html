    <!-- Header -->

    <section class="page-header">

        <h1>Contact Us</h1>

        <p>
            We'd love to hear your feedback and suggestions.
        </p>

    </section>

    <!-- Contact Form -->

    <section class="contact-section">

        <div class="contact-card">

            <h2>Get in Touch</h2>

            <form>

                <input
                    type="text"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    placeholder="Your Email"
                    required>

                <textarea
                    rows="6"
                    placeholder="Your Message"
                    required></textarea>

                <button
                    type="submit"
                    class="primary-btn">
                    Send Message
                </button>

            </form>

        </div>

    </section>

    <!-- Footer -->

    <footer>
